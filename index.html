<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interaktivt Venndiagram – testad version</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#17263d;font:16px system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{margin:0 0 6px}p{line-height:1.5}.muted{color:#52647d}.card{background:#fff;border:1px solid #d9e3f0;border-radius:14px;padding:20px;margin:16px 0}.row{display:flex;gap:15px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}input,select,button{font:inherit;border:1px solid #aabbd0;border-radius:8px;padding:9px}input[type=number]{width:105px}#expr{width:min(100%,550px);font-size:23px}button{background:#edf3fc;cursor:pointer}button:hover{background:#dbe9ff}button.primary{background:#235fc9;color:white}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#a51d26;min-height:20px}canvas{display:block;width:100%;height:auto;background:#f6f9fe;border:2px solid #7d8ca4;border-radius:10px}.warning{background:#fff6df;border:1px solid #f2dca3;padding:12px;border-radius:8px}.swatch{display:inline-block;background:#ffdb45;border:1px solid #ba9218;width:17px;height:17px;vertical-align:middle}#status{font-weight:600}@media(max-width:600px){main{padding:10px}.card{padding:14px}}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}header h1{font-size:25px}.workspace{background:#fff;border:1px solid #d9e3f0;border-radius:14px;overflow:clip}.stickyInput{position:sticky;top:0;z-index:5;background:#fff;padding:14px 18px 10px;border-bottom:1px solid #d9e3f0;box-shadow:0 3px 8px #1b355312}.stickyInput label{margin-bottom:5px}.stickyInput #expr{width:100%;max-width:none}.buttons{margin-top:8px}.buttons button{padding:7px 12px}.stickyInput .error{min-height:0;margin:4px 0}.settingsPanel{padding:16px 18px;background:#f7faff;border-bottom:1px solid #d9e3f0}.settingsPanel[hidden]{display:none}.diagramWrap{padding:14px}.diagramWrap canvas{max-height:calc(100vh - 235px);min-height:260px;object-fit:contain}.diagramWrap #status{margin:8px 0 0;font-size:13px}.note{font-size:13px}#settingsToggle{white-space:nowrap}@media(max-width:600px){header h1{font-size:20px}.stickyInput{padding:10px}.buttons{gap:5px}.buttons button{padding:6px 8px}.diagramWrap{padding:6px}}
</style></head><body><main><header><h1>Venndiagram</h1><button id="settingsToggle" type="button" aria-expanded="false">⚙ Inställningar</button></header>
<section class="workspace"><div class="stickyInput"><label for="expr">Skriv händelse</label><input id="expr" type="text" value="A* ∪ B*" spellcheck="false" autocomplete="off" aria-label="Sannolikhetsuttryck"><div class="buttons"><button data-add="∪">∪ eller</button><button data-add="∩">∩ och</button><button data-add="*">* inte</button><button data-add="(">(</button><button data-add=")">)</button><button id="show" class="primary">Visa</button><button id="hide">Dölj</button></div><p id="expressionError" class="error"></p></div>
<div id="settingsPanel" class="settingsPanel" hidden><div class="row"><label>Antal händelser<select id="count"><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div id="inputs" class="row"></div><label id="abwrap">P(A ∩ B), %<input id="ab" type="number" min="0" max="100" step="any" value="30"></label></div><p id="geometryError" class="error"></p><p class="muted"><small>För 2 händelser anpassas cirklarna efter sannolikheterna. För 3–5 är de schematiska.</small></p></div>
<div class="diagramWrap"><canvas id="diagram" width="900" height="530" aria-label="Venndiagram"></canvas><p id="status" aria-live="polite"></p></div></section>
<p class="muted note">* = inte · ∪ = eller · ∩ = och. Du kan också skriva U och n. Cirklarna är en illustration och är inte alltid exakt areaskaliga.</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),letters='ABCDE';let visible=true,geometry=[],fn=null;const canvas=$('diagram'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function count(){return Number($('count').value)}
function parse(src,n=count()){let s=src.replace(/\s+/g,'').replace(/[¬!]/g,'*').replace(/[∪|]/g,'|').replace(/[∩&]/g,'&').replace(/U/gi,'|').replace(/n/g,'&').toUpperCase();if(!s)throw Error('Skriv ett uttryck.');const t=[...s];let i=0;function atom(){if(t[i]==='('){i++;const f=or();if(t[i]!==')')throw Error('Saknad högerparentes.');i++;return f}const a=t[i++];if(!a||!letters.slice(0,n).includes(a))throw Error('Förväntade A–'+letters[n-1]+' eller parentes.');return m=>Boolean(m&(1<<letters.indexOf(a)))}function not(){let f=atom();while(t[i]==='*'){i++;const old=f;f=m=>!old(m)}return f}function and(){let f=not();while(t[i]==='&'){i++;const left=f,right=not();f=m=>left(m)&&right(m)}return f}function or(){let f=and();while(t[i]==='|'){i++;const left=f,right=and();f=m=>left(m)||right(m)}return f}const f=or();if(i!==t.length)throw Error('Ogiltigt uttryck vid: '+t.slice(i).join(''));return f}
function intersection(r1,r2,d){if(d>=r1+r2)return 0;if(d<=Math.abs(r1-r2))return Math.PI*Math.min(r1,r2)**2;const a=Math.acos(Math.max(-1,Math.min(1,(d*d+r1*r1-r2*r2)/(2*d*r1)))),b=Math.acos(Math.max(-1,Math.min(1,(d*d+r2*r2-r1*r1)/(2*d*r2))));return r1*r1*a+r2*r2*b-.5*Math.sqrt(Math.max(0,(-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2)))}
function layout(){const ps=[...$('inputs').querySelectorAll('input')].map(x=>Number(x.value)/100);if(ps.some(p=>!Number.isFinite(p)||p<0||p>1))throw Error('Ange sannolikheter mellan 0 och 100 %.');const n=count();let circles=[];if(n===2){const q=Number($('ab').value)/100,lo=Math.max(0,ps[0]+ps[1]-1),hi=Math.min(...ps);if(!Number.isFinite(q)||q<lo-1e-8||q>hi+1e-8)throw Error('P(A ∩ B) måste vara mellan '+(lo*100).toFixed(1)+' % och '+(hi*100).toFixed(1)+' %.');const k=220,r1=Math.sqrt(ps[0])*k,r2=Math.sqrt(ps[1])*k;let l=Math.abs(r1-r2),h=r1+r2,target=Math.PI*k*k*q;for(let i=0;i<65;i++){let d=(l+h)/2;if(intersection(r1,r2,d)>target)l=d;else h=d}let d=(l+h)/2;if(q===0)d=r1+r2;if(q===hi)d=Math.abs(r1-r2);circles=[{x:450-d/2,y:265,r:r1},{x:450+d/2,y:265,r:r2}]}else{const positions={3:[[380,210],[525,210],[450,340]],4:[[360,200],[535,200],[360,345],[535,345]],5:[[345,190],[550,190],[450,275],[355,375],[550,375]]}[n];circles=ps.map((p,i)=>({x:positions[i][0],y:positions[i][1],r:Math.sqrt(p)*140}))}const left=Math.min(...circles.map(c=>c.x-c.r)),right=Math.max(...circles.map(c=>c.x+c.r)),top=Math.min(...circles.map(c=>c.y-c.r)),bottom=Math.max(...circles.map(c=>c.y+c.r));const scale=Math.min(1,800/Math.max(1,right-left),440/Math.max(1,bottom-top));for(const c of circles){c.x=450+(c.x-(left+right)/2)*scale;c.y=265+(c.y-(top+bottom)/2)*scale;c.r*=scale}return circles}
function regionMask(x,y,cs){let m=0;for(let j=0;j<cs.length;j++){const c=cs[j];if((x-c.x)**2+(y-c.y)**2<=c.r*c.r)m|=1<<j}return m}
function render(){ctx.clearRect(0,0,900,530);ctx.fillStyle='#f6f9fe';ctx.fillRect(0,0,900,530);if(!geometry.length||!fn)return;const img=ctx.createImageData(900,530),pixels=img.data;for(let y=0;y<530;y++)for(let x=0;x<900;x++){const m=regionMask(x+.5,y+.5,geometry),selected=visible&&fn(m),inside=m!==0;let rgb=selected?[255,219,69]:inside?[196,216,240]:[246,249,254];const k=(y*900+x)*4;pixels[k]=rgb[0];pixels[k+1]=rgb[1];pixels[k+2]=rgb[2];pixels[k+3]=255}ctx.putImageData(img,0,0);ctx.lineWidth=3;ctx.strokeStyle='#2e5e9c';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillStyle='#193b6a';for(let j=0;j<geometry.length;j++){const c=geometry[j];ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.stroke();ctx.fillText(letters[j],c.x,c.y-c.r-11)}ctx.textAlign='left';ctx.font='20px system-ui';ctx.fillStyle='#516682';ctx.fillText('Ω – utfallsrummet',20,35);$('status').textContent=visible?'Gult område: '+$('expr').value:'Markeringen är dold.'}
function draw(){try{geometry=layout();$('geometryError').textContent=''}catch(e){geometry=[];$('geometryError').textContent=e.message}try{fn=parse($('expr').value);$('expressionError').textContent=''}catch(e){fn=null;$('expressionError').textContent=e.message}render()}
function setup(){const old=[...$('inputs').querySelectorAll('input')].map(e=>e.value);$('inputs').replaceChildren();for(let i=0;i<count();i++){const l=document.createElement('label');l.textContent='P('+letters[i]+'), %';const e=document.createElement('input');e.type='number';e.min=0;e.max=100;e.step='any';e.value=old[i]??[50,70,40,55,35][i];e.addEventListener('input',draw);l.append(e);$('inputs').append(l)}$('abwrap').hidden=count()!==2;draw()}
$('settingsToggle').addEventListener('click',()=>{const panel=$('settingsPanel');panel.hidden=!panel.hidden;$('settingsToggle').setAttribute('aria-expanded',String(!panel.hidden));});$('count').addEventListener('change',setup);$('ab').addEventListener('input',draw);$('expr').addEventListener('input',()=>{visible=true;draw()});$('show').addEventListener('click',()=>{visible=true;draw()});$('hide').addEventListener('click',()=>{visible=false;draw()});document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const e=$('expr'),a=e.selectionStart,z=e.selectionEnd,t=b.dataset.add;e.value=e.value.slice(0,a)+t+e.value.slice(z);e.focus();e.setSelectionRange(a+t.length,a+t.length);visible=true;draw()}));setup();
// Tests can be run in Chromium by opening ?test=1. All tests are executed against the actual expression parser and pixel region logic.
if(new URLSearchParams(location.search).has('test')){let failures=[];const cases=[['A',[0,1,0,1]],['B',[0,0,1,1]],['A ∩ B',[0,0,0,1]],['A ∪ B',[0,1,1,1]],['A* ∩ B',[0,0,1,0]],['A* ∪ B*',[1,1,1,0]],['(A ∪ B)*',[1,0,0,0]],['A* ∩ B*',[1,0,0,0]],['A U B',[0,1,1,1]],['A n B',[0,0,0,1]],['a',[0,1,0,1]],['A*',[1,0,1,0]],['B*',[1,1,0,0]]];for(const [expr,expected] of cases){try{const f=parse(expr,2);for(let mask=0;mask<4;mask++)if(Number(f(mask))!==expected[mask])failures.push(expr+' mask '+mask)}catch(e){failures.push(expr+': '+e.message)}}const old=$('expr').value;for(const [expr,expected] of cases){$('expr').value=expr;draw();if(!fn)failures.push('render '+expr);else{const cs=geometry;const probes=[[20,500],[cs[0].x-cs[0].r*.6,cs[0].y],[cs[1].x+cs[1].r*.6,cs[1].y],[(cs[0].x+cs[1].x)/2,cs[0].y]];for(const [x,y] of probes){const m=regionMask(x,y,cs),data=ctx.getImageData(Math.floor(x),Math.floor(y),1,1).data,isYellow=data[0]===255&&data[1]===219&&data[2]===69;if(isYellow!==Boolean(fn(m)))failures.push('pixel '+expr+' '+x+','+y)}}}$('expr').value=old;draw();const output=document.createElement('pre');output.id='test-results';output.textContent=failures.length?'FAIL: '+failures.join('; '):'PASS: '+cases.length+' uttryck, 4 sanningsvärden per uttryck och pixelkontroller. ';document.body.append(output)}
})();
</script></body></html>
